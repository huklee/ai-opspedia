[project]
name = "opspedia-poc"
version = "0.1.0"
description = "ai-opspedia PoC: open-source based ops wiki (see docs/mvp-poc.md)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pyyaml>=6",
  "pydantic>=2.7",
  "sqlglot>=25",
  "sqlite-utils>=3.37",
  "opensearch-py>=2.6",
  "pyahocorasick>=2.1",
  "networkx>=3.3",
  "markitdown>=0.1",
  "mcp>=2.2,<3",
  "openai>=1.40",
  "numpy>=1.26",
  "filelock>=3.13",
  "langchain-text-splitters>=0.2",
  "httpx>=0.27",
  "markdown-it-py>=3",
  "mdit-py-plugins>=0.4",
  "pygments>=2.21.0",
  "python-multipart>=0.0.32",
  "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.7"]

[project.scripts]
opspedia-poc = "opspedia_poc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opspedia_poc"]
