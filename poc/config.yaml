# ai-opspedia PoC 설정 (dummy 데이터 기준)
data_dir: data
sources:
  - {kind: dag_repo, name: reco-dags, path: dummy/dags}
  - {kind: airflow_fixture, name: airflow-prod, path: dummy/airflow.json}
  - {kind: ddl, name: warehouse, path: dummy/ddl, dialect: hive}
  - {kind: search_fixture, name: es-prod, path: dummy/search.json}
  - {kind: incidents_fixture, name: jira-reco, path: dummy/incidents}
  - {kind: incident_bundles, name: incident-raw, path: dummy/incidents_raw}
  - {kind: manuals, name: reco-manuals, path: dummy/manuals}
  - {kind: metrics_fixture, name: prometheus, path: dummy/metrics}
  - {kind: manuals, name: uploads, path: data/uploads, parser: static}   # 화면에서 수동 업로드한 문서

systems:
  - id: reco
    title: Reco 추천 시스템
    team: reco-platform
    description: 피처 → 후보 생성 → 랭킹 → 피드 발행까지의 추천 배치 파이프라인과 검색 인덱스
  - id: search
    title: 상품 검색
    team: search-infra
    description: 상품 검색 인덱스 빌드와 alias 전환, 검색 로그 적재

teams:
  - id: reco-platform
    title: 추천 플랫폼팀
    oncall: "@reco-oncall (PagerDuty: reco-primary)"
    channel: "#reco-ops"
  - id: search-infra
    title: 검색 인프라팀
    oncall: "@search-oncall (PagerDuty: search-primary)"
    channel: "#search-ops"

# DAG → 시스템 매핑(태그가 없을 때)
dag_systems:
  product_index_build: search
  product_index_alias_swap: search
  search_log_etl: search
  query_suggest_build: search

# 인덱스 패밀리 (alias 또는 패턴 단위, ADR-016)
index_families:
  - {id: products, pattern: "products_v*", alias: products, builder_dag: product_index_build, freshness_hours: 26, system: search}
  - {id: reco-feed, pattern: "reco-feed-*", alias: reco-feed, builder_dag: reco_feed_publish, freshness_hours: 26, system: reco}
  - {id: query-suggest, pattern: "query-suggest-*", alias: query-suggest, builder_dag: query_suggest_build, freshness_hours: 170, system: search}

# 테이블 → 시스템 매핑(스키마 접두사)
schema_systems: {reco: reco, search: search, logs: search}

# 운영 용어: nori 사용자 사전 + 동의어 쿼리 확장 (ADR-019)
user_dictionary:
  - 추천배치
  - 피처스토어
  - 후보생성
  - 롤오버
  - 리인덱스
  - 백필
# 엔티티는 아니지만 검증 시 알려진 식별자로 취급 (Airflow · ES · Hive 용어)
known_terms: [max_active_runs, catchup, upstream_failed, max_doc_drop, docs_count, number_of_replicas, executor_memory, on_failure_callback, try_number, unassigned_shards]
# 한국어 별칭 → 엔티티 (자연어 질의 해석)
aliases:
  추천 피드: index:reco-feed
  피드 인덱스: index:reco-feed
  상품 인덱스: index:products
  products 인덱스: index:products
  자동완성: index:query-suggest
  피처스토어: dag:feature_store_daily
  랭킹 배치: dag:ranking_score_daily
  후보생성: dag:candidate_gen_hourly
  추천 CTR: metric:reco_ctr
  검색 무결과율: metric:search_zero_rate
synonyms:
  - [추천, 리코, reco]
  - [피처, feature, 특성]
  - [인덱스, index, 색인]
  - [장애, 인시던트, incident]
  - [별칭, alias]
  - [백필, backfill, 재처리]

# 원천 스냅샷 기준 시각 (dummy 데이터의 "현재")
now: "2026-09-29T09:00:00+09:00"

# 합성 · 자연어 검색 LLM = 사내 GPT-OSS-120B (ADR-018). 엔드포인트 URL 은 환경변수 GPT_OSS_BASE_URL
# 미설정 · 장애 시 fallback(PoC 대역, 로컬 Ollama)으로 처리하고 생성 이력에 실제 모델을 기록
llm:
  provider: openai
  model: gpt-oss-120b
  base_url_env: GPT_OSS_BASE_URL
  api_key_env: GPT_OSS_API_KEY
  temperature: 0.1
  concurrency: 4
  fallback: {provider: ollama, model: "qwen2.5:3b", base_url: "http://127.0.0.1:11434/v1", api_key_env: OLLAMA_API_KEY, temperature: 0.1}
ask:
  provider: openai
  model: gpt-oss-120b
  base_url_env: GPT_OSS_BASE_URL
  api_key_env: GPT_OSS_API_KEY
  temperature: 0.1
  fallback: {provider: ollama, model: "qwen2.5:3b", base_url: "http://127.0.0.1:11434/v1", api_key_env: OLLAMA_API_KEY, temperature: 0.1}

embedder:
  provider: off          # off | sentence-transformers
  model: nlpai-lab/KURE-v1

search:
  backend: opensearch    # opensearch | sqlite_fts
  opensearch_url: http://127.0.0.1:9200
  index: opspedia-poc-docs

server:
  host: 0.0.0.0
  port: 8443
  certs: certs   # tailscale.crt · tailscale.key 위치 (환경변수 OPSPEDIA_CERTS 우선) · 없으면 serve --http
  api_token_env: OPSPEDIA_API_TOKEN
